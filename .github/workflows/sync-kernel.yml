name: Sync Kernel Source from hisi-oss

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # 每月1号自动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Clear kernel folder
        run: |
          rm -rf kernel
          mkdir -p kernel

      - name: Download kernel source tarball
        run: |
          curl -sL \
            "https://api.github.com/repos/hisi-oss/kernel_tarballs/tarball/Agassi2-AL00_OO_EMUI8.0.0_Opensource" \
            -o /tmp/kernel.tar.gz

      - name: Extract to kernel folder
        run: |
          tar xzf /tmp/kernel.tar.gz --strip-components=1 -C kernel

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync kernel source from hisi-oss/kernel_tarballs (Agassi2-AL00_OO_EMUI8.0.0_Opensource)"
            git push
          fi
